services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hrsys
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: hrsys
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hrsys_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrsys -d hrsys"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hrsys_postgres:
